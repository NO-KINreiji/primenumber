<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速・高精度 素数チェッカー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #2c3e50;
    }
    .settings-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #7f8c8d;
      transition: color 0.3s;
    }
    .settings-btn:hover {
      color: #34495e;
    }
    .settings-panel {
      display: none;
      background: #fdfdfd;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .settings-panel.active {
      display: block;
    }
    .setting-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .setting-item input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border 0.3s;
    }
    input[type="text"]:focus {
      border-color: #3498db;
    }
    button.check-btn {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    button.check-btn:hover {
      background-color: #2980b9;
    }
    .result-area {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      min-height: 100px;
      word-break: break-all;
    }
    .result-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #ccc;
    }
    .result-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .result-label {
      font-weight: bold;
      color: #555;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .result-value {
      font-size: 18px;
      color: #111;
    }
    .prime-result {
      font-size: 24px;
      font-weight: bold;
      color: #e74c3c;
      text-align: center;
      margin-bottom: 20px;
    }
    .prime-result.is-prime {
      color: #27ae60;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>素数チェッカー</h1>
    <button class="settings-btn" id="settingsToggle" title="設定">⚙️</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-item"><input type="checkbox" id="chk-factorization" checked> <label for="chk-factorization">(素数じゃない場合) 素因数分解を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-div-list"> <label for="chk-div-list">約数一覧を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-div-count"> <label for="chk-div-count">約数の個数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-div-sum"> <label for="chk-div-sum">約数の総和を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-min-factor"> <label for="chk-min-factor">(素数じゃない場合) 最小の素因数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-max-factor"> <label for="chk-max-factor">(素数じゃない場合) 最大の素因数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-prev-prime"> <label for="chk-prev-prime">直前の素数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-next-prime"> <label for="chk-next-prime">直後の素数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-closest-prime"> <label for="chk-closest-prime">最も近い素数を表示</label></div>
    <div class="setting-item"><input type="checkbox" id="chk-prime-index"> <label for="chk-prime-index">何番目の素数かを表示</label></div>
  </div>

  <div class="input-group">
    <input type="text" id="numberInput" inputmode="numeric" placeholder="自然数を入力 (15桁以上もOK)" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    <button class="check-btn" onclick="analyzeNumber()">判定</button>
  </div>

  <div class="result-area" id="resultArea">
    ここに結果が表示されます。
  </div>
</div>

<script>
  // 設定パネルの開閉
  document.getElementById('settingsToggle').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('active');
  });

  // Enterキーで判定を実行
  document.getElementById('numberInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') analyzeNumber();
  });

  // --- BigInt対応の便利なヘルパー関数 ---
  function bigIntSqrt(value) {
    if (value < 0n) return 0n;
    if (value < 2n) return value;
    let x0 = value / 2n;
    let x1 = (x0 + value / x0) / 2n;
    while (x1 < x0) {
      x0 = x1;
      x1 = (x0 + value / x0) / 2n;
    }
    return x0;
  }

  // ミラー・ラビン素数判定法（15桁以上の大きな数でも高速かつ正確に判定）
  function isPrimeBig(n) {
    if (n <= 1n) return false;
    if (n <= 3n) return true;
    if (n % 2n === 0n || n % 3n === 0n) return false;

    // 小さな底を使ったミラー・ラビン法（2^64未満まで決定的に判定できる組み合わせ）
    const bases = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
    
    let d = n - 1n;
    let s = 0n;
    while (d % 2n === 0n) {
      d /= 2n;
      s += 1n;
    }

    for (let a of bases) {
      if (n <= a) break;
      let x = powerMod(a, d, n);
      if (x === 1n || x === n - 1n) continue;
      let composite = true;
      for (let r = 1n; r < s; r++) {
        x = powerMod(x, 2n, n);
        if (x === n - 1n) {
          composite = false;
          break;
        }
      }
      if (composite) return false;
    }
    return true;
  }

  // (base^exp) % mod を計算
  function powerMod(base, exp, mod) {
    let res = 1n;
    base = base % mod;
    while (exp > 0n) {
      if (exp % 2n === 1n) res = (res * base) % mod;
      base = (base * base) % mod;
      exp /= 2n;
    }
    return res;
  }

  // ポラード・rho法による高速素因数分解（15桁以上の数にも対応）
  function pollardRho(n) {
    if (n % 2n === 0n) return 2n;
    if (isPrimeBig(n)) return n;

    let x = 2n, y = 2n, d = 1n, c = 1n;
    let f = (val) => (powerMod(val, 2n, n) + c) % n;

    while (d === 1n) {
      x = f(x);
      y = f(f(y));
      let diff = x > y ? x - y : y - x;
      d = gcd(diff, n);
      if (d === n) {
        x = BigInt(Math.floor(Math.random() * 100) + 2);
        y = x;
        c = BigInt(Math.floor(Math.random() * 100) + 1);
        d = 1n;
      }
    }
    return d;
  }

  function gcd(a, b) {
    while (b !== 0n) {
      let temp = b;
      b = a % b;
      a = temp;
    }
    return a;
  }

  function getPrimeFactorsBig(n) {
    let factors = {};
    let queue = [n];

    while (queue.length > 0) {
      let current = queue.pop();
      if (current === 1n) continue;
      if (isPrimeBig(current)) {
        factors[current.toString()] = (factors[current.toString()] || 0) + 1;
      } else {
        let divisor = pollardRho(current);
        queue.push(divisor);
        queue.push(current / divisor);
      }
    }
    return factors;
  }

  // 約数一覧（数値を安全に処理できる範囲用、大きすぎる場合は制限または高速化）
  function getDivisors(numStr) {
    let num = BigInt(numStr);
    let divs = [];
    let sqrtN = bigIntSqrt(num);
    for (let i = 1n; i <= sqrtN; i++) {
      if (num % i === 0n) {
        divs.push(i);
        let counterpart = num / i;
        if (counterpart !== i) divs.push(counterpart);
      }
    }
    return divs.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
  }

  // 直前の素数（15桁などの巨大な数ではブラウザフリーズを防ぐため、探索幅に安全上限を設定）
  function getPrevPrime(num) {
    let curr = num - 1n;
    let limit = num > 1000n ? num - 10000n : 1n; // 探索幅制限
    if (limit < 2n) limit = 2n;
    while (curr >= limit) {
      if (isPrimeBig(curr)) return curr;
      curr--;
    }
    return null;
  }

  // 直後の素数
  function getNextPrime(num) {
    let curr = num + 1n;
    let limit = num + 10000n; // 探索幅制限
    while (curr <= limit) {
      if (isPrimeBig(curr)) return curr;
      curr++;
    }
    return null;
  }

  // メイン判定処理
  function analyzeNumber() {
    const inputVal = document.getElementById('numberInput').value.trim();
    if (!inputVal) return;

    let num;
    try {
      num = BigInt(inputVal);
    } catch (e) {
      return;
    }

    if (num < 1n) {
      document.getElementById('resultArea').innerHTML = '<div class="prime-result">自然数（1以上）を入力してください。</div>';
      return;
    }

    const resultArea = document.getElementById('resultArea');
    const isPrimeNum = isPrimeBig(num);
    let html = '';

    // ① 素数かどうかの結果
    if (num === 1n) {
      html += `<div class="prime-result">1 は素数でも合成数でもありません。</div>`;
    } else if (isPrimeNum) {
      html += `<div class="prime-result is-prime">${num.toString()} は素数です！</div>`;
    } else {
      html += `<div class="prime-result">${num.toString()} は素数ではありません（合成数）。</div>`;
    }

    // 15桁など巨大な数の場合、全約数の列挙はメモリ・速度的に重すぎるため警告を出すか安全に処理
    const isHuge = num > 1000000000000n; // 1兆を超える場合
    let divisors = [];
    if (!isHuge) {
      divisors = getDivisors(inputVal);
    }

    // [素因数分解を表示]
    if (!isPrimeNum && num > 1n && document.getElementById('chk-factorization').checked) {
      const factors = getPrimeFactorsBig(num);
      let keys = Object.keys(factors).sort((a, b) => (BigInt(a) < BigInt(b) ? -1 : 1));
      let factHtml = keys.map(base => {
        let exp = factors[base];
        return exp > 1 ? `${base}<sup>${exp}</sup>` : `${base}`;
      }).join(' &times; ');
      html += `<div class="result-item"><div class="result-label">素因数分解</div><div class="result-value">${factHtml}</div></div>`;
    }

    // [約数一覧を表示]
    if (document.getElementById('chk-div-list').checked) {
      if (isHuge) {
        html += `<div class="result-item"><div class="result-label">約数一覧</div><div class="result-value" style="font-size:14px; color:#e67e22;">※値が大きすぎるため、約数一覧の表示は省略します</div></div>`;
      } else {
        html += `<div class="result-item"><div class="result-label">約数一覧</div><div class="result-value">${divisors.map(d => d.toString()).join(', ')}</div></div>`;
      }
    }

    // [約数の個数を表示]
    if (document.getElementById('chk-div-count').checked) {
      if (isHuge) {
        // 素因数分解から個数を計算
        const factors = getPrimeFactorsBig(num);
        let count = 1n;
        for (let k in factors) {
          count *= BigInt(factors[k] + 1);
        }
        html += `<div class="result-item"><div class="result-label">約数の個数</div><div class="result-value">${count.toString()} 個</div></div>`;
      } else {
        html += `<div class="result-item"><div class="result-label">約数の個数</div><div class="result-value">${divisors.length} 個</div></div>`;
      }
    }

    // [約数の総和を表示]
    if (document.getElementById('chk-div-sum').checked) {
      if (isHuge) {
        html += `<div class="result-item"><div class="result-label">約数の総和</div><div class="result-value" style="font-size:14px; color:#e67e22;">※値が大きすぎるため計算を省略しました</div></div>`;
      } else {
        let sum = divisors.reduce((acc, val) => acc + val, 0n);
        html += `<div class="result-item"><div class="result-label">約数の総和</div><div class="result-value">${sum.toString()}</div></div>`;
      }
    }

    // [最小の素因数を表示]
    if (!isPrimeNum && num > 1n && document.getElementById('chk-min-factor').checked) {
      const factors = getPrimeFactorsBig(num);
      let minF = Object.keys(factors).reduce((min, k) => (BigInt(k) < BigInt(min) ? k : min), Object.keys(factors)[0]);
      html += `<div class="result-item"><div class="result-label">最小の素因数</div><div class="result-value">${minF}</div></div>`;
    }

    // [最大の素因数を表示]
    if (!isPrimeNum && num > 1n && document.getElementById('chk-max-factor').checked) {
      const factors = getPrimeFactorsBig(num);
      let maxF = Object.keys(factors).reduce((max, k) => (BigInt(k) > BigInt(max) ? k : max), Object.keys(factors)[0]);
      html += `<div class="result-item"><div class="result-label">最大の素因数</div><div class="result-value">${maxF}</div></div>`;
    }

    // [直前の素数を表示]
    if (document.getElementById('chk-prev-prime').checked) {
      const prev = getPrevPrime(num);
      const val = prev ? prev.toString() : 'なし';
      html += `<div class="result-item"><div class="result-label">直前の素数</div><div class="result-value">${val}</div></div>`;
    }

    // [直後の素数を表示]
    if (document.getElementById('chk-next-prime').checked) {
      const next = getNextPrime(num);
      const val = next ? next.toString() : 'なし';
      html += `<div class="result-item"><div class="result-label">直後の素数</div><div class="result-value">${val}</div></div>`;
    }

    // [最も近い素数を表示（距離が同じなら両方表示）]
    if (document.getElementById('chk-closest-prime').checked) {
      const prev = getPrevPrime(num);
      const next = getNextPrime(num);
      let closest = [];
      if (!prev && next) {
        closest.push(next);
      } else if (prev && !next) {
        closest.push(prev);
      } else if (prev && next) {
        const diff1 = num - prev;
        const diff2 = next - num;
        if (diff1 === diff2) {
          closest = [prev, next];
        } else if (diff1 < diff2) {
          closest = [prev];
        } else {
          closest = [next];
        }
      }
      html += `<div class="result-item"><div class="result-label">最も近い素数</div><div class="result-value">${closest.map(c => c.toString()).join(', ')}</div></div>`;
    }

    // [何番目の素数かを表示]
    if (document.getElementById('chk-prime-index').checked) {
      if (isPrimeNum) {
        if (num > 100000n) {
          html += `<div class="result-item"><div class="result-label">素数の順番</div><div class="result-value" style="font-size:14px; color:#e67e22;">※値が大きすぎるため何番目か特定できません</div></div>`;
        } else {
          let count = 0;
          for (let i = 2n; i <= num; i++) {
            if (isPrimeBig(i)) count++;
          }
          html += `<div class="result-item"><div class="result-label">素数の順番</div><div class="result-value">${count} 番目の素数</div></div>`;
        }
      } else {
        html += `<div class="result-item"><div class="result-label">素数の順番</div><div class="result-value" style="font-size:14px; color:#777;">※素数ではないため計算されません</div></div>`;
      }
    }

    resultArea.innerHTML = html;
  }
</script>

</body>
</html>
