<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Checker</title>
    <style>
        /* ベースリセットと画面全体の設定 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fafafa;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Yu Gothic", sans-serif;
            box-sizing: border-box;
        }

        /* 中央のメインコンテナ */
        .container {
            width: 90%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            color: #1a1a1a;
        }

        /* 入力フィールド */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            text-align: center;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            background-color: #fdfdfd;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        input[type="text"]:focus {
            border-color: #b0b0b0;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        /* ボタン */
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: #fff;
            background-color: #222;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 結果表示エリア */
        #result {
            margin-top: 2rem;
            font-size: 1.2rem;
            font-weight: 500;
            min-height: 1.5em;
            word-break: break-all;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #result.show {
            opacity: 1;
        }

        .prime { color: #2ecc71; }
        .not-prime { color: #e74c3c; }
        .error { color: #888; font-size: 0.9rem; font-weight: normal; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PRIME CHECKER</h1>
        <input type="text" id="numberInput" placeholder="数字を入力してください" autocomplete="off">
        <button onclick="checkPrime()">判定する</button>
        <div id="result"></div>
    </div>

    <script>
        // べき乗剰余 (base^exponent % modulus) を高速に計算する関数 (BigInt用)
        function powerMod(base, exponent, modulus) {
            if (modulus === 1n) return 0n;
            let result = 1n;
            base = base % modulus;
            while (exponent > 0n) {
                if (exponent % 2n === 1n) result = (result * base) % modulus;
                exponent = exponent / 2n;
                base = (base * base) % modulus;
            }
            return result;
        }

        // ミラー・ラビン素数判定法
        function isPrimeMillerRabin(n) {
            if (n <= 1n) return false;
            if (n === 2n || n === 3n) return true;
            if (n % 2n === 0n) return false;

            let d = n - 1n;
            let s = 0n;
            while (d % 2n === 0n) {
                d /= 2n;
                s++;
            }

            // 判定の精度を上げるための素数の底（これらでテストすれば実用上ほぼ100%正確）
            const bases = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n, 53n, 59n, 61n, 67n, 71n];

            for (let i = 0; i < bases.length; i++) {
                let a = bases[i];
                if (n <= a) break;

                let x = powerMod(a, d, n);
                if (x === 1n || x === n - 1n) continue;

                let isProbablePrime = false;
                for (let r = 1n; r < s; r++) {
                    x = powerMod(x, 2n, n);
                    if (x === n - 1n) {
                        isProbablePrime = true;
                        break;
                    }
                }
                if (!isProbablePrime) return false;
            }
            return true;
        }

        // 判定ボタンが押されたときの処理
        function checkPrime() {
            const inputVal = document.getElementById('numberInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            // アニメーションのリセット
            resultDiv.classList.remove('show');
            
            setTimeout(() => {
                // 入力チェック（半角数字のみか）
                if (!/^\d+$/.test(inputVal)) {
                    resultDiv.innerHTML = '<span class="error">有効な自然数（半角数字）を入力してください。</span>';
                    resultDiv.classList.add('show');
                    return;
                }

                try {
                    const n = BigInt(inputVal);
                    const isPrime = isPrimeMillerRabin(n);

                    if (isPrime) {
                        resultDiv.innerHTML = '<span class="prime">素数です (Prime)</span>';
                    } else {
                        resultDiv.innerHTML = '<span class="not-prime">素数ではありません</span>';
                    }
                } catch (e) {
                    resultDiv.innerHTML = '<span class="error">数値が大きすぎるか不正です。</span>';
                }
                
                resultDiv.classList.add('show');
            }, 50); // 少し遅延させてUIの描画とアニメーションをスムーズにする
        }

        // Enterキーでも判定できるようにする
        document.getElementById('numberInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPrime();
            }
        });
    </script>
</body>
</html>
